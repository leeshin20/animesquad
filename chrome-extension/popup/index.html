<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>AnimeSquad</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main id="app">
    <header class="popup-header">
      <div class="brand-lockup">
        <img src="../assets/logo-mark.svg" alt="" aria-hidden="true" />
        <h1>AnimeSquad</h1>
      </div>
      <section id="account-section" class="account-section hidden" aria-label="로그인 계정">
        <span class="account-avatar">
          <span id="account-initial" aria-hidden="true"></span>
          <img id="account-avatar" class="hidden" alt="프로필 사진" referrerpolicy="no-referrer" />
        </span>
        <p id="account-name"></p>
      </section>
    </header>
    <div id="session-panel" class="session-panel hidden">
      <section class="current-anime-section" aria-label="현재 탭에서 감지한 작품" aria-live="polite">
        <p id="current-anime-title">감지 정보를 확인하고 있어요</p>
        <p id="current-anime-meta" class="hint"></p>
        <p id="playback-status" class="hint hidden" role="status"></p>
      </section>
    </div>
    <p id="auto-record-status" class="hint hidden" role="status"></p>
    <section id="view-login" class="view hidden">
      <div class="state-copy">
        <span class="state-kicker">로그인이 필요해요</span>
        <p class="hint">animesquad.me에 로그인하면 확장 프로그램이 자동으로 연결돼요.</p>
      </div>
      <button id="btn-login" type="button">animesquad.me에서 로그인</button>
    </section>

    <section id="view-empty" class="view hidden">
      <div class="empty-state">
        <span class="status-badge">기록 대기</span>
      </div>
    </section>

    <section id="view-record" class="view hidden">
      <div class="anime-section">
        <div>
          <span class="field-kicker">기록할 작품</span>
          <p id="anime-label"></p>
        </div>
        <button id="btn-change-anime" class="text-button hidden" type="button">다른 작품</button>
      </div>
      <p id="watchlist-warning" class="warning hidden">워치리스트에 함께 추가돼요.</p>

      <div id="search-section" class="search-section hidden">
        <label for="search-input">작품 검색</label>
        <input id="search-input" type="text" placeholder="애니 검색..." autocomplete="off" />
        <ul id="search-results" aria-label="검색 결과"></ul>
      </div>

      <div class="episode-field">
        <label for="ep-input">화수</label>
        <input id="ep-input" type="number" min="1" inputmode="numeric" />
      </div>
      <details class="optional-review">
        <summary>감상 남기기</summary>
        <div class="rating-field">
          <span>평점 · 선택</span>
          <div id="stars" role="radiogroup" aria-label="평점">
            <button class="star" type="button" role="radio" aria-checked="false" aria-label="1점" data-v="1">★</button>
            <button class="star" type="button" role="radio" aria-checked="false" aria-label="2점" data-v="2">★</button>
            <button class="star" type="button" role="radio" aria-checked="false" aria-label="3점" data-v="3">★</button>
            <button class="star" type="button" role="radio" aria-checked="false" aria-label="4점" data-v="4">★</button>
            <button class="star" type="button" role="radio" aria-checked="false" aria-label="5점" data-v="5">★</button>
          </div>
        </div>
        <div class="comment-field">
          <label for="comment-input">한줄평 · 선택</label>
          <textarea id="comment-input" placeholder="이번 화는 어땠나요?" maxlength="280"></textarea>
        </div>
      </details>

      <div class="btn-row">
        <button id="btn-record" type="button">시청함</button>
        <button id="btn-dismiss" class="secondary" type="button">무시</button>
      </div>
      <p id="record-status" class="record-status hidden" role="status"></p>
    </section>

    <section id="view-done" class="view done-view hidden">
      <div class="done-icon">
        <img src="../assets/logo-mark.svg" alt="" aria-hidden="true" />
        <span class="done-check" aria-hidden="true">✓</span>
      </div>
      <p class="done-msg">기록 완료!</p>
    </section>
  </main>
  <script src="../shared/api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
