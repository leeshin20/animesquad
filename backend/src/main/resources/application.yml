spring:
  application:
    name: animesquad
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

app:
  invite:
    code: ${INVITE_CODE:}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-at-least-32-bytes!!}
    ttl-minutes: 43200
  oauth:
    success-redirect: ${OAUTH_SUCCESS_REDIRECT:http://localhost:3000/}
  cookie:
    domain: ${COOKIE_DOMAIN:}
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  anilist:
    url: ${ANILIST_URL:https://graphql.anilist.co}
  admin:
    emails: ${ADMIN_EMAILS:}
  upload:
    dir: ${UPLOAD_DIR:uploads}
    public-base: ${UPLOAD_PUBLIC_BASE:http://localhost:8080}
